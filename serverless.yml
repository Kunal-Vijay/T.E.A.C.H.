service: teach-api

frameworkVersion: "3"

provider:
  name: aws
  runtime: python3.12
  stage: ${opt:stage, 'dev'}
  region: ${param:REGION, 'ap-south-1'}
  environment:
    DATABASE_URL: ${param:DATABASE_URL}
    GEMINI_API_KEY: ${param:GEMINI_API_KEY}
    GEMINI_MODEL: ${param:GEMINI_MODEL, 'gemini-2.5-flash'}
    S3_BUCKET: ${param:S3_BUCKET}
    STAGE: ${self:provider.stage}
    REGION: ${self:provider.region}
    FRONTEND_ORIGIN: ${param:FRONTEND_ORIGIN, 'http://localhost:5173'}
    LIVE_CLASS_CONTENT_GENERATION_QUEUE_URL: ${param:LIVE_CLASS_CONTENT_GENERATION_QUEUE_URL}
    LIVE_CLASS_IMAGE_GENERATION_QUEUE_URL: ${param:LIVE_CLASS_IMAGE_GENERATION_QUEUE_URL}

params:
  dev:
    DATABASE_URL: postgresql://postgres:postgres@localhost:5432/teach
    GEMINI_API_KEY: ""
    S3_BUCKET: ai-tutor-assets-dev
    LIVE_CLASS_CONTENT_GENERATION_QUEUE_URL: ""
    LIVE_CLASS_IMAGE_GENERATION_QUEUE_URL: ""

functions:
  app: ${file(serverless/app/app.${self:provider.stage}.yml):app}
  liveClassContentGenerationHandler:
    handler: app.handlers.live_class_content_generation_handler.handle
    timeout: 900
    memorySize: 1024
    events:
      - sqs:
          arn: ${param:CONTENT_QUEUE_ARN, 'arn:aws:sqs:ap-south-1:123456789012:live-class-content-generation-queue'}
          batchSize: 1
  liveClassImageGenerationHandler:
    handler: app.handlers.live_class_image_generation_handler.handle
    timeout: 300
    memorySize: 512
    events:
      - sqs:
          arn: ${param:IMAGE_QUEUE_ARN, 'arn:aws:sqs:ap-south-1:123456789012:live-class-image-generation-queue'}
          batchSize: 1

package:
  patterns:
    - "!migrations/**"
    - "!tests/**"
    - "!teach-frontend/**"
    - "!alembic.ini"

plugins:
  - serverless-python-requirements

custom:
  pythonRequirements:
    dockerizePip: true
    layer: true
