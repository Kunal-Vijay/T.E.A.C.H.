service: teach-api

frameworkVersion: "3"

provider:
  name: aws
  runtime: python3.12
  stage: ${opt:stage, 'dev'}
  region: ${param:REGION, 'ap-south-1'}
  environment:
    DATABASE_URL: ${param:DATABASE_URL}
    BEDROCK_MODEL_ID: ${param:BEDROCK_MODEL_ID, 'us.anthropic.claude-sonnet-4-6'}
    BEDROCK_DOUBT_MODEL_ID: ${param:BEDROCK_DOUBT_MODEL_ID, 'amazon.nova-lite-v1:0'}
    BEDROCK_DOUBT_MAX_TOKENS: ${param:BEDROCK_DOUBT_MAX_TOKENS, '4096'}
    BEDROCK_REGION: ${param:BEDROCK_REGION, 'us-west-2'}
    S3_BUCKET: ${param:S3_BUCKET}
    STAGE: ${self:provider.stage}
    REGION: ${self:provider.region}
    FRONTEND_ORIGIN: ${param:FRONTEND_ORIGIN, 'http://localhost:5173'}

params:
  dev:
    DATABASE_URL: postgresql://postgres:postgres@localhost:5432/teach
    BEDROCK_MODEL_ID: us.anthropic.claude-sonnet-4-6
    BEDROCK_DOUBT_MODEL_ID: amazon.nova-lite-v1:0
    BEDROCK_DOUBT_MAX_TOKENS: "4096"
    BEDROCK_REGION: us-west-2
    S3_BUCKET: ai-tutor-assets-dev

functions:
  app: ${file(serverless/app/app.${self:provider.stage}.yml):app}

package:
  patterns:
    - "!migrations/**"
    - "!tests/**"
    - "!teach-frontend/**"
    - "!alembic.ini"

plugins:
  - serverless-python-requirements

custom:
  pythonRequirements:
    dockerizePip: true
    layer: true
